name: Fintech Microservice Configuration Drift Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-drift-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest httpx pandas numpy

      - name: Run Pytest Test Suite
        run: |
          pytest -v tests/

      - name: Execute Pre-Flight Drift Gate Check (CLI)
        run: |
          python cli/fintech_drift_val.py --service payment-processor --source-env staging --target-env production --scenario none

      - name: Execute 50-Scenario Benchmark Experiment
        run: |
          python experiments/benchmark.py
