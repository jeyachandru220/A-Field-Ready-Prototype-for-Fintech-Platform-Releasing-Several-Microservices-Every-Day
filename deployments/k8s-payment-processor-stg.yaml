# Kubernetes Staging Deployment Manifest - Payment Processor
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: staging
  labels:
    app: payment-processor
    tier: payment
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
      - name: payment-processor
        image: fintech/payment-processor:v2.4.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 1000m
            memory: 2Gi
        env:
        - name: ENV_NAME
          value: "staging"
        - name: PAYMENT_DB_HOST
          value: "db-staging.payments.internal"
        - name: PAYMENT_DB_SSLMODE
          value: "require"
        - name: BANK_GATEWAY_URL
          value: "https://staging-api.bank-partner.test/v1"
        - name: MAX_DB_POOL_SIZE
          value: "50"
        - name: MANDATE_STRIP_PAN
          value: "true"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-processor-ingress
  namespace: staging
spec:
  tls:
  - hosts:
    - staging-payments.bank.internal
    secretName: payment-tls-cert
  rules:
  - host: staging-payments.bank.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: payment-processor
            port:
              number: 8080
