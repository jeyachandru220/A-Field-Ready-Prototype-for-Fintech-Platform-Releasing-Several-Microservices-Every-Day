# Kubernetes Production Deployment Manifest - Payment Processor (With Drift Annotations)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-processor
  namespace: production
  labels:
    app: payment-processor
    tier: payment
    environment: production
spec:
  replicas: 4
  selector:
    matchLabels:
      app: payment-processor
  template:
    metadata:
      labels:
        app: payment-processor
    spec:
      containers:
      - name: payment-processor
        image: fintech/payment-processor:v2.4.0
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 1000m
            memory: 2Gi
          limits:
            cpu: 2000m
            memory: 4Gi
        env:
        - name: ENV_NAME
          value: "production"
        - name: PAYMENT_DB_HOST
          value: "db-production.payments.internal"
        - name: PAYMENT_DB_SSLMODE
          value: "require" # DRIFT POINT: Setting to 'disable' triggers CRITICAL risk
        - name: BANK_GATEWAY_URL
          value: "https://api.payments.bank.internal/v1" # DRIFT POINT: Leak of staging URL triggers CRITICAL risk
        - name: MAX_DB_POOL_SIZE
          value: "100"
        - name: MANDATE_STRIP_PAN
          value: "true" # DRIFT POINT: Setting to 'false' triggers CRITICAL compliance risk
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-processor-ingress
  namespace: production
spec:
  tls:
  - hosts:
    - payments.bank.internal
    secretName: payment-prod-tls-cert
  rules:
  - host: payments.bank.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: payment-processor
            port:
              number: 8080
